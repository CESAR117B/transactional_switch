services:
  postgres:
    image: postgres:18
    container_name: postgres_18
    restart: "no"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: test
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Carpeta de respaldos (se mapea en modo escritura para que pgAdmin pueda guardar copias de seguridad)
      - ./back-up:/var/lib/postgresql/backups
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: root@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - postgres_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  postgres_network:
    # Nombre fijo: los microservicios la declaran como `external: true`, así
    # que ambos compose deben coincidir exactamente en el nombre.
    name: postgres_network
    driver: bridge