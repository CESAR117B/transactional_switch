services:
  postgres:
    image: postgres:18
    container_name: postgres_18
    restart: "no"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: test
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./back-up:/var/lib/postgresql/backups
      - ./back-up/init-switch.sh:/docker-entrypoint-initdb.d/init-switch.sh
      - ./back-up/switch_transaccional.dump:/docker-entrypoint-initdb.d/switch_transaccional.dump
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: root@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Mapea directamente la carpeta de respaldos del usuario en pgAdmin hacia ./back-up
      - ./back-up:/var/lib/pgadmin/storage/root_admin.com
    networks:
      - postgres_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  postgres_network:
    name: postgres_network
    driver: bridge