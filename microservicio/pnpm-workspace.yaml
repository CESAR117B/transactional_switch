allowBuilds:
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - globals@17.11.0
  - '@nestjs/common@11.2.1 || 11.2.3'
  - '@nestjs/core@11.2.1 || 11.2.3'
  - '@nestjs/microservices@11.2.1 || 11.2.3'
  - '@nestjs/platform-express@11.2.1 || 11.2.3'
  - '@nestjs/testing@11.2.1 || 11.2.3'
  - '@prisma/adapter-pg@7.10.0'
  - '@prisma/client-runtime-utils@7.10.0'
  - '@prisma/client@7.10.0'
  - '@prisma/config@7.10.0'
  - '@prisma/debug@7.10.0'
  - '@prisma/driver-adapter-utils@7.10.0'
  - '@prisma/engines@7.10.0'
  - '@prisma/fetch-engine@7.10.0'
  - '@prisma/get-platform@7.10.0'
  - '@types/node@26.3.0 || 26.4.0'
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - prisma@7.10.0
  - typescript-eslint@8.68.0

overrides:
  brace-expansion: ">=5.0.8"
  fast-uri: ">=3.1.5"
  js-yaml: " >=4.3.1"
  deepmerge-ts: ">=8.0.0"
