services:
  microservicio:
    build:
      context: ../microservicio
      dockerfile: Dockerfile
    container_name: nest_microservicio
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ../microservicio:/app
      - /app/node_modules
    env_file:
      - ../microservicio/.env
    networks:
      - postgres_network

  client-app:
    build:
      context: ../client-app
      dockerfile: Dockerfile
    container_name: nest_client_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../client-app:/app
      - /app/node_modules
    env_file:
      - ../client-app/.env
    depends_on:
      - microservicio
    networks:
      - postgres_network

networks:
  postgres_network:
    external: true