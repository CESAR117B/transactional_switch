services:
  microservicio:
    build:
      context: ../microservicio
      dockerfile: Dockerfile
    container_name: nest_microservicio
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_ENV: production
    env_file:
      - path: ../microservicio/.env.example
        required: false
      - path: ../microservicio/.env
        required: false
    networks:
      - postgres_network

  client-app:
    build:
      context: ../client-app
      dockerfile: Dockerfile
    container_name: nest_client_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MICROSERVICE_HOST: microservicio
      MICROSERVICE_PORT: "3001"
      NODE_ENV: production
      ENABLE_SWAGGER: "${ENABLE_SWAGGER:-true}"
    env_file:
      - path: ../client-app/.env.example
        required: false
      - path: ../client-app/.env
        required: false
    depends_on:
      - microservicio
    networks:
      - postgres_network

networks:
  postgres_network:
    external: true