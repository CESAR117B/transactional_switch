services:
  microservicio:
    build:
      context: ../microservicio
      dockerfile: Dockerfile
    container_name: nest_microservicio
    restart: unless-stopped
    # Sólo red interna: NO se publica en el host. El gateway lo alcanza por
    # el nombre de servicio `microservicio:3001`.
    expose:
      - "3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_ENV: production
    env_file:
      - ../microservicio/.env
    networks:
      - postgres_network

  client-app:
    build:
      context: ../client-app
      dockerfile: Dockerfile
    container_name: nest_client_app
    restart: unless-stopped
    # Único servicio publicado: es la puerta de entrada del sistema.
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MICROSERVICE_HOST: microservicio
      MICROSERVICE_PORT: "3001"
      NODE_ENV: production
    env_file:
      - ../client-app/.env
    depends_on:
      - microservicio
    networks:
      - postgres_network

networks:
  postgres_network:
    external: true
