services:
  microservicio:
    build:
      context: ../microservicio
      dockerfile: Dockerfile
    container_name: nest_microservicio
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ../microservicio:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - NODE_ENV=development
    networks:
      - postgres_network

  client-app:
    build:
      context: ../client-app
      dockerfile: Dockerfile
    container_name: nest_client_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../client-app:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MICROSERVICE_HOST=microservicio
      - MICROSERVICE_PORT=3001
    depends_on:
      - microservicio
    networks:
      - postgres_network

networks:
  postgres_network:
    external: true